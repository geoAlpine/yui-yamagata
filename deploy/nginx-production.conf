# /etc/nginx/sites-available/yui
#
# ★ Cloudflare を前段に置く場合、/etc/nginx/conf.d/cloudflare-realip.conf を
#   先に入れること。忘れると nginx のログに残るIPが全部 Cloudflare のものになり、
#   fail2ban と auto-block-attackers.sh が Cloudflare のアドレス帯をBANして
#   サイトが全員から見えなくなる。

server {
    listen 80;
    server_name yui-yamagata.com www.yui-yamagata.com;
    return 301 https://yui-yamagata.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.yui-yamagata.com;
    ssl_certificate     /etc/letsencrypt/live/yui-yamagata.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yui-yamagata.com/privkey.pem;
    return 301 https://yui-yamagata.com$request_uri;
}

server {
    listen 443 ssl;
    server_name yui-yamagata.com;

    ssl_certificate     /etc/letsencrypt/live/yui-yamagata.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yui-yamagata.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 内容ハッシュ付きの静的アセットは長期キャッシュ。
    # 本文と分けておくことで、文言を直しても再送されるのはHTMLだけになる。
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }


    # 写真はNext.jsを通さずnginxが直接返す。
    # 災害時にアプリのCPUを画像配信に使わない。
    # 内容は不変（UUIDのファイル名）なので長期キャッシュしてよい。
    location /uploads/ {
        alias /var/www/yui/production/current/uploads/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        # 画像以外は返さない
        location ~ /uploads/.*\.(?!webp$) { return 404; }
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
