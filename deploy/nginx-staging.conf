# /etc/nginx/sites-available/yui-staging
#
# ステージングは「見られても害がない」ではなく「見られてはいけない」。
# 災害情報サイトのテストデータを被災者が信じると実害が出る。
# アプリ側の帯と noindex に加えて、サーバ側でも三重に止める。

server {
    listen 80;
    server_name staging.yui-yamagata.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name staging.yui-yamagata.com;

    ssl_certificate     /etc/letsencrypt/live/staging.yui-yamagata.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.yui-yamagata.com/privkey.pem;

    # ① Basic認証。検索避けだけでは、URLを知られた時点で読まれてしまう
    auth_basic           "confirmation site";
    auth_basic_user_file /etc/nginx/yui-staging.htpasswd;

    # ② ヘッダでも索引を止める（アプリ側の robots.txt と二重化）
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # ③ ステージングはキャッシュしない。古い確認結果が残ると判断を誤る
    add_header Cache-Control "no-store" always;


    # 写真はNext.jsを通さずnginxが直接返す。
    # 災害時にアプリのCPUを画像配信に使わない。
    # 内容は不変（UUIDのファイル名）なので長期キャッシュしてよい。
    location /uploads/ {
        alias /var/www/yui/staging/current/uploads/;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        # 画像以外は返さない
        location ~ /uploads/.*\.(?!(webp|jpg)$) { return 404; }
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
